<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="背景を読み、数字で会社を育てる24か月の経営シミュレーション">
    <title>Formula Company</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div><p class="eyebrow">MANAGEMENT SIMULATION</p><h1>FORMULA <span>COMPANY</span></h1></div>
        <div class="month"><small>OPERATING MONTH</small><strong id="month-label">MONTH 1 / 24</strong></div>
      </header>

      <section class="scenario card" aria-labelledby="scenario-title">
        <div class="section-label"><span>01</span> MARKET SIGNAL</div>
        <div class="scenario-copy"><p id="scenario-category"></p><h2 id="scenario-title"></h2><p id="scenario-description"></p></div>
        <div class="signal"><span></span> SIGNAL DETECTED</div>
      </section>

      <section class="dashboard">
        <div class="status-panel card">
          <div class="section-heading"><div class="section-label"><span>02</span> COMPANY STATUS</div><p id="trend-label">前月比 —</p></div>
          <div id="status-grid" class="status-grid"></div>
        </div>

        <div class="decision-panel card">
          <div class="section-label"><span>03</span> YOUR DECISION</div>
          <p class="hint">今月の市場に合わせて、4つのレバーを調整してください。</p>
          <div id="controls" class="controls"></div>
          <div class="budget"><span>今月の予定支出</span><strong id="planned-cost"></strong></div>
          <button id="next-turn" class="primary">次の月へ <span>→</span></button>
        </div>
      </section>

      <section id="result" class="result card" hidden aria-live="polite"></section>
      <section id="ending" class="ending card" hidden aria-live="polite"></section>
      <footer><span>FORMULA COMPANY / LOCAL EDITION</span><span>READ · DECIDE · LEARN</span></footer>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
